name: Deploy Monitor Stack

on:
  push:
    branches: [main, dev]
    paths:
      - 'monitor-stack/**'

jobs:
  deploy-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_JUMPHOST }}" > ~/.ssh/beta_testing
          echo "${{ secrets.SSH_KEY_MONITOR }}" > ~/.ssh/rsa_id
          chmod 600 ~/.ssh/beta_testing ~/.ssh/rsa_id

          eval "$(ssh-agent -s)"
          echo "$SSH_PASSPHRASE" | SSH_ASKPASS=/bin/echo DISPLAY=1 ssh-add ~/.ssh/beta_testing
          echo "$SSH_PASSPHRASE" | SSH_ASKPASS=/bin/echo DISPLAY=1 ssh-add ~/.ssh/rsa_id

          ssh-keyscan -H 164.30.10.149 >> ~/.ssh/known_hosts
          ssh-keyscan -H 172.16.0.20 >> ~/.ssh/known_hosts
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}

      - name: Rsync monitor-stack to remote
        run: |
          echo "Deploying monitor-stack to /home/ubuntu/peer_cd/monitoring-stack/"

          rsync -az --delete \
            --exclude='.git' \
            -e "ssh -J ubuntu@164.30.10.149" \
            monitor-stack/ \
            ubuntu@172.16.0.20:/home/ubuntu/peer_cd/monitoring-stack/
